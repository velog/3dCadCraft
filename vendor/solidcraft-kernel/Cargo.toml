[package]
name = "solidcraft-kernel"
description = "SolidCraft B-rep kernel boundary: solids, extrude/revolve/booleans/fillets, meshes, measures and STEP, behind our own API (implemented with solidcore)"
version = "0.40.0-rc.2"
edition = "2024"
license = "MIT OR Apache-2.0"


[dependencies]
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "f5e8e9a29e0c9b7cf6c4040a5bc8878382b3c62f" }
solidcraft-geom = { git = "https://github.com/tangency-labs/solidcraft", rev = "c7dcab172faf351d77983b78cdffe18059e35dda" }
solidcraft-smlib = { git = "https://github.com/tangency-labs/solidcraft", rev = "c7dcab172faf351d77983b78cdffe18059e35dda" }
solidcraft-profile = { git = "https://github.com/tangency-labs/solidcraft", rev = "c7dcab172faf351d77983b78cdffe18059e35dda" }
solidcraft-step = { git = "https://github.com/tangency-labs/solidcraft", rev = "c7dcab172faf351d77983b78cdffe18059e35dda" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
spade = { version = "2.15", default-features = false, features = ["std"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

[dev-dependencies]
solidcraft-profile = { git = "https://github.com/tangency-labs/solidcraft", rev = "c7dcab172faf351d77983b78cdffe18059e35dda", features = ["enabled"] }
proptest = { version = "1", default-features = false, features = ["std"] }
