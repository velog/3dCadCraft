name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Shared runners have no stable timing: results are checked, budgets not.
  CADCRAFT3D_NO_BUDGETS: "1"

jobs:
  core:
    name: Core (Linux, no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # Optimised as release, without its link-time optimisation: the thin LTO with one codegen
      # unit is linked again for each of the ~110 test and example binaries, which took most of
      # the job's 5-6 hours (the runner's limit is 6).
      - name: cargo test --release --no-default-features
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --no-default-features --no-fail-fast 2>&1 | tee test-output.txt
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # The job's log needs a login; its annotations do not: the failed tests as one annotation.
      - name: Failed tests
        if: failure()
        shell: bash
        run: ./.github/failed-tests.sh test-output.txt
      - run: cargo doc --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  gui:
    name: GUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --lib
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib --no-fail-fast 2>&1 | tee test-output.txt
      - name: Failed tests
        if: failure()
        shell: bash
        run: ./.github/failed-tests.sh test-output.txt
      - run: cargo build --release
